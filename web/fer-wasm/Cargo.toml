[package]
name = "fer-wasm"
version = "0.1.0"
edition = "2021"
description = "The facial emotion study's seven networks, run in the browser"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libm = "0.2"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
